<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- V字渐变：从绿色到蓝色 -->
    <linearGradient id="vGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- 画笔杆渐变 -->
    <linearGradient id="brushHandleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- 文件外框 -->
  <path d="M6 2h14l8 8v20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <!-- 折角 -->
  <path d="M20 2v6a2 2 0 0 0 2 2h6" fill="#334155"/>
  <!-- V字左笔画 -->
  <path d="M8 12c0.5-0.5 1.5-0.3 1.8 0.5l4.2 10" stroke="url(#vGradientDark)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- V字右笔画（画笔形状） -->
  <path d="M14 22.5l5.5-11.5c0.4-0.8 1.2-1.2 1.8-0.8" stroke="url(#vGradientDark)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- 画笔笔尖 -->
  <ellipse cx="22" cy="24" rx="1.2" ry="1.8" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(-35 22 24)"/>
  <!-- 画笔杆 -->
  <line x1="22.5" y1="22.5" x2="25.5" y2="19" stroke="url(#brushHandleDark)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
