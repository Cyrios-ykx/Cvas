<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="800" height="420" fill="#0f1419" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e7e9ea" font-size="18" font-weight="bold">⚡ Vuvas vs DOM — Performance Benchmark (ms, lower is better)</text>
  
  <!-- Legend -->
  <rect x="280" y="50" width="14" height="14" rx="3" fill="#42b883"/>
  <text x="300" y="62" fill="#e7e9ea" font-size="12">Vuvas (Canvas)</text>
  <rect x="420" y="50" width="14" height="14" rx="3" fill="#f56c6c"/>
  <text x="440" y="62" fill="#e7e9ea" font-size="12">DOM</text>

  <!-- Grid lines -->
  <line x1="60" y1="80" x2="60" y2="370" stroke="#1d2833" stroke-width="1"/>
  <line x1="60" y1="370" x2="770" y2="370" stroke="#38444d" stroke-width="1"/>
  
  <!-- Y-axis labels (log scale reference) -->
  <text x="55" y="370" text-anchor="end" fill="#71767b" font-size="10">0</text>
  <text x="55" y="322" text-anchor="end" fill="#71767b" font-size="10">5</text>
  <line x1="60" y1="322" x2="770" y2="322" stroke="#1d2833" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="55" y="274" text-anchor="end" fill="#71767b" font-size="10">10</text>
  <line x1="60" y1="274" x2="770" y2="274" stroke="#1d2833" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="55" y="178" text-anchor="end" fill="#71767b" font-size="10">20</text>
  <line x1="60" y1="178" x2="770" y2="178" stroke="#1d2833" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="55" y="82" text-anchor="end" fill="#71767b" font-size="10">40</text>
  <line x1="60" y1="82" x2="770" y2="82" stroke="#1d2833" stroke-width="0.5" stroke-dasharray="4"/>

  <!-- Scale: 0-40ms mapped to 370-80 (290px range), linear -->
  <!-- barHeight = value / 40 * 290 -->
  
  <!-- Test 1: Create 1000 nodes — Vuvas: 0.87ms, DOM: 16.95ms -->
  <g transform="translate(90, 0)">
    <!-- Vuvas bar: 0.87/40*290 = 6.3 -->
    <rect x="0" y="363.7" width="28" height="6.3" rx="3" fill="#42b883"/>
    <text x="14" y="359" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">0.87</text>
    <!-- DOM bar: 16.95/40*290 = 122.9 -->
    <rect x="32" y="247.1" width="28" height="122.9" rx="3" fill="#f56c6c"/>
    <text x="46" y="242" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">16.95</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">Create</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">1000 nodes</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">19.6x</text>
  </g>

  <!-- Test 2: Update 1000 nodes — Vuvas: 0.4ms, DOM: 0.7ms -->
  <g transform="translate(180, 0)">
    <!-- Vuvas bar: 0.4/40*290 = 2.9 -->
    <rect x="0" y="367.1" width="28" height="2.9" rx="2" fill="#42b883"/>
    <text x="14" y="362" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">0.40</text>
    <!-- DOM bar: 0.7/40*290 = 5.1 -->
    <rect x="32" y="364.9" width="28" height="5.1" rx="2" fill="#f56c6c"/>
    <text x="46" y="360" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">0.70</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">Update</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">1000 props</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">1.8x</text>
  </g>

  <!-- Test 3: List reorder — Vuvas: 0.53ms, DOM: 14.22ms -->
  <g transform="translate(270, 0)">
    <!-- Vuvas bar: 0.53/40*290 = 3.8 -->
    <rect x="0" y="366.2" width="28" height="3.8" rx="2" fill="#42b883"/>
    <text x="14" y="361" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">0.53</text>
    <!-- DOM bar: 14.22/40*290 = 103.1 -->
    <rect x="32" y="266.9" width="28" height="103.1" rx="3" fill="#f56c6c"/>
    <text x="46" y="262" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">14.22</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">List</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">reorder</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">26.7x</text>
  </g>

  <!-- Test 4: Deep nested tree — Vuvas: 4.57ms, DOM: 38.3ms -->
  <g transform="translate(360, 0)">
    <!-- Vuvas bar: 4.57/40*290 = 33.1 -->
    <rect x="0" y="336.9" width="28" height="33.1" rx="3" fill="#42b883"/>
    <text x="14" y="332" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">4.57</text>
    <!-- DOM bar: 38.3/40*290 = 277.7 -->
    <rect x="32" y="92.3" width="28" height="277.7" rx="3" fill="#f56c6c"/>
    <text x="46" y="87" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">38.30</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">Deep tree</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">2187 nodes</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">8.4x</text>
  </g>

  <!-- Test 5: List pagination — Vuvas: 0.18ms, DOM: 4.38ms -->
  <g transform="translate(450, 0)">
    <!-- Vuvas bar: 0.18/40*290 = 1.3 -->
    <rect x="0" y="368.7" width="28" height="1.3" rx="1" fill="#42b883"/>
    <text x="14" y="364" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">0.18</text>
    <!-- DOM bar: 4.38/40*290 = 31.8 -->
    <rect x="32" y="338.2" width="28" height="31.8" rx="3" fill="#f56c6c"/>
    <text x="46" y="333" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">4.38</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">Pagination</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">500 items</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">23.9x</text>
  </g>

  <!-- Test 6: Conditional render — Vuvas: 0.33ms, DOM: 0.78ms -->
  <g transform="translate(540, 0)">
    <!-- Vuvas bar: 0.33/40*290 = 2.4 -->
    <rect x="0" y="367.6" width="28" height="2.4" rx="2" fill="#42b883"/>
    <text x="14" y="363" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">0.33</text>
    <!-- DOM bar: 0.78/40*290 = 5.7 -->
    <rect x="32" y="364.3" width="28" height="5.7" rx="2" fill="#f56c6c"/>
    <text x="46" y="360" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">0.78</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">v-if toggle</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">200 items</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">2.4x</text>
  </g>

  <!-- Test 7: Complex styles — Vuvas: 0.3ms, DOM: 3.07ms -->
  <g transform="translate(630, 0)">
    <!-- Vuvas bar: 0.3/40*290 = 2.2 -->
    <rect x="0" y="367.8" width="28" height="2.2" rx="2" fill="#42b883"/>
    <text x="14" y="363" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">0.30</text>
    <!-- DOM bar: 3.07/40*290 = 22.3 -->
    <rect x="32" y="347.7" width="28" height="22.3" rx="3" fill="#f56c6c"/>
    <text x="46" y="343" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">3.07</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">Complex</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">styles</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">10.2x</text>
  </g>

  <!-- Test 8: Hit test — Vuvas: 5ms, DOM: 16.63ms -->
  <g transform="translate(720, 0)">
    <!-- Vuvas bar: 5/40*290 = 36.3 -->
    <rect x="0" y="333.7" width="28" height="36.3" rx="3" fill="#42b883"/>
    <text x="14" y="329" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">5.00</text>
    <!-- DOM bar: 16.63/40*290 = 120.6 -->
    <rect x="32" y="249.4" width="28" height="120.6" rx="3" fill="#f56c6c"/>
    <text x="46" y="244" text-anchor="middle" fill="#f56c6c" font-size="9" font-weight="bold">16.63</text>
    <!-- Label -->
    <text x="30" y="390" text-anchor="middle" fill="#a0aab4" font-size="9">Hit test</text>
    <text x="30" y="402" text-anchor="middle" fill="#a0aab4" font-size="9">2000×1000</text>
    <!-- Ratio -->
    <text x="30" y="415" text-anchor="middle" fill="#42b883" font-size="9" font-weight="bold">3.3x</text>
  </g>

  <!-- Footer -->
  <text x="400" y="75" text-anchor="middle" fill="#536471" font-size="10">Chrome 148 · Windows 10 · Intel Core · 2026-05-29</text>
</svg>
