<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Vuvas.png" />
  <title>Vuvas SFC Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      color: #e0e0e0;
      margin-bottom: 16px;
      font-size: 24px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 24px;
      font-size: 14px;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .hint {
      color: #666;
      margin-top: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>
    <img src="/Vuvas.png" alt="Vuvas" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 8px;">
    Vuvas SFC Preview
  </h1>
  <p class="subtitle">直接预览 .vuvas 单文件组件 — createVuvasApp(App).mount('#app')</p>
  <canvas id="app" width="800" height="600"></canvas>
  <p class="hint">🖱️ 使用鼠标滚轮滚动查看更多内容</p>
  <script type="module" src="/demo/sfc-main.ts"></script>
</body>
</html>
