<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Vuvas.png" />
  <title>Vuvas Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      color: #e0e0e0;
      margin-bottom: 16px;
      font-size: 24px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 24px;
      font-size: 14px;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1><img src="/Vuvas.png" alt="Vuvas" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 8px;">Vuvas Demo</h1>
  <p class="subtitle">Canvas 上的 Vue — 零学习成本在 Canvas 中构建界面</p>
  <canvas id="app" width="800" height="600"></canvas>
  <p class="subtitle" style="margin-top: 12px; font-size: 12px;">🖱️ 使用鼠标滚轮滚动查看更多内容</p>
  <p class="subtitle" style="margin-top: 8px; font-size: 12px;">
    <a href="/sfc.html" style="color: #42b883; text-decoration: none;">📦 查看 SFC 预览 →</a>
    <span style="margin: 0 8px; color: #555;">|</span>
    <a href="/benchmarks/" style="color: #42b883; text-decoration: none;">⚡ 性能基准测试 →</a>
    <span style="margin-left: 8px; color: #555;">createVuvasApp(App).mount('#app')</span>
  </p>
  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
